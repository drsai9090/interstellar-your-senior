name: Synthetic demo checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-demo.txt
      - run: python -m pip install -r backend/requirements-demo.txt
      - name: Backend access and evidence checks
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Labelled synthetic evaluation
        working-directory: backend
        run: python -m app.evaluate --output ../outputs/evaluation.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node --test src/api/client.test.js
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-provider-stub-evaluation
          path: outputs/evaluation.json
          if-no-files-found: error
